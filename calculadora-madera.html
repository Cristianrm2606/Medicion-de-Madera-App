<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de Madera</title>
<style>
  :root {
    --bg: #f6f1e9;
    --card: #ffffff;
    --text: #2b2118;
    --muted: #7a6a5a;
    --accent: #8a5a2b;
    --accent-text: #ffffff;
    --line: #e4d9cb;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 4px 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    font-size: 22px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  .medidas { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .x { font-size: 26px; padding-bottom: 10px; color: var(--muted); }
  .preview { margin: 12px 0; font-size: 16px; color: var(--muted); min-height: 22px; }
  .preview b { color: var(--text); font-size: 20px; }
  button {
    font-size: 18px;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button.secundario { background: #efe6da; color: var(--text); }
  button.borrar { background: transparent; color: var(--danger); padding: 4px 8px; font-size: 20px; }
  .ancho { width: 100%; }
  .fila-botones { display: flex; gap: 8px; flex-wrap: wrap; }
  .fila-botones button { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  .vacio { color: var(--muted); text-align: center; padding: 16px; }
  .totales { display: grid; gap: 6px; margin-top: 12px; }
  .totales div { display: flex; justify-content: space-between; }
  .grande { font-size: 24px; font-weight: 700; }
  .historial-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .historial-item small { color: var(--muted); display: block; }
</style>
</head>
<body>
<main>
  <h1>🪵 Hoja de Madera</h1>

  <div class="card">
    <label for="proveedor">Proveedor</label>
    <input id="proveedor" type="text" placeholder="Nombre del proveedor">
  </div>

  <div class="card">
    <div class="medidas">
      <div>
        <label for="a">Medida</label>
        <input id="a" type="number" inputmode="decimal" step="any" placeholder="7">
      </div>
      <div class="x">×</div>
      <div>
        <label for="b">Largo</label>
        <input id="b" type="number" inputmode="decimal" step="any" placeholder="4">
      </div>
    </div>
    <div class="preview" id="preview"></div>
    <button class="ancho" id="agregar">Agregar</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>#</th><th>Medida</th><th class="num">Resultado</th><th></th></tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>

    <div class="totales">
      <div><span>Piezas</span><span id="piezas">0</span></div>
      <div class="grande"><span>Total</span><span id="total">0</span></div>
      <div>
        <label for="precio" style="margin:0;align-self:center">Precio por unidad</label>
        <input id="precio" type="number" inputmode="decimal" step="any" placeholder="0" style="width:140px;font-size:18px">
      </div>
      <div class="grande"><span>A pagar</span><span id="pagar">$0.00</span></div>
    </div>
  </div>

  <div class="fila-botones" style="margin-bottom:16px">
    <button id="guardar">Guardar hoja</button>
    <button class="secundario" id="nueva">Hoja nueva</button>
  </div>

  <div class="card">
    <h2 style="font-size:18px;margin:0 0 8px">Hojas guardadas</h2>
    <div id="historial"></div>
  </div>
</main>

<script>
  // Fórmula de la hoja: medida × medida × largo ÷ 4
  function calcular(a, b) { return a * a * b / 4; }

  function fmt(n) { return Number(n.toFixed(2)).toLocaleString('es'); }
  function dinero(n) { return '$' + n.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  function leer(clave, porDefecto) {
    try { const v = localStorage.getItem(clave); return v ? JSON.parse(v) : porDefecto; }
    catch (e) { return porDefecto; }
  }
  function escribir(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
  }

  let hoja = leer('hojaActual', { proveedor: '', precio: '', filas: [] });
  let historial = leer('historial', []);

  const $ = id => document.getElementById(id);

  function guardarActual() { escribir('hojaActual', hoja); }

  function totalDe(h) { return h.filas.reduce((s, f) => s + calcular(f.a, f.b), 0); }

  function pintar() {
    $('proveedor').value = hoja.proveedor;
    $('precio').value = hoja.precio;

    const tbody = $('filas');
    tbody.innerHTML = '';
    if (hoja.filas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="vacio">Todavía no hay piezas</td></tr>';
    }
    hoja.filas.forEach((f, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + String(i + 1).padStart(2, '0') + '</td>' +
        '<td>' + fmt(f.a) + ' × ' + fmt(f.b) + '</td>' +
        '<td class="num">' + fmt(calcular(f.a, f.b)) + '</td>' +
        '<td class="num"><button class="borrar" title="Quitar">✕</button></td>';
      tr.querySelector('button').onclick = () => {
        hoja.filas.splice(i, 1);
        guardarActual();
        pintar();
      };
      tbody.appendChild(tr);
    });

    const total = totalDe(hoja);
    $('piezas').textContent = hoja.filas.length;
    $('total').textContent = fmt(total);
    $('pagar').textContent = dinero(total * (parseFloat(hoja.precio) || 0));

    pintarHistorial();
  }

  function pintarHistorial() {
    const cont = $('historial');
    cont.innerHTML = '';
    if (historial.length === 0) {
      cont.innerHTML = '<div class="vacio">No hay hojas guardadas</div>';
      return;
    }
    historial.forEach((h, i) => {
      const div = document.createElement('div');
      div.className = 'historial-item';
      div.innerHTML =
        '<div><b></b><small></small></div>' +
        '<div class="fila-botones"><button class="secundario">Abrir</button><button class="borrar">✕</button></div>';
      div.querySelector('b').textContent = h.proveedor || 'Sin proveedor';
      div.querySelector('small').textContent =
        h.fecha + ' · ' + h.filas.length + ' piezas · total ' + fmt(totalDe(h));
      const [abrir, borrar] = div.querySelectorAll('button');
      abrir.onclick = () => {
        hoja = { proveedor: h.proveedor, precio: h.precio, filas: h.filas.slice() };
        guardarActual();
        pintar();
        window.scrollTo(0, 0);
      };
      borrar.onclick = () => {
        if (!confirm('¿Borrar esta hoja guardada?')) return;
        historial.splice(i, 1);
        escribir('historial', historial);
        pintarHistorial();
      };
      cont.appendChild(div);
    });
  }

  function actualizarPreview() {
    const a = parseFloat($('a').value), b = parseFloat($('b').value);
    $('preview').innerHTML = (a > 0 && b > 0)
      ? fmt(a) + ' × ' + fmt(a) + ' × ' + fmt(b) + ' ÷ 4 = <b>' + fmt(calcular(a, b)) + '</b>'
      : '';
  }

  function agregar() {
    const a = parseFloat($('a').value), b = parseFloat($('b').value);
    if (!(a > 0 && b > 0)) { $('a').focus(); return; }
    hoja.filas.push({ a, b });
    guardarActual();
    $('a').value = '';
    // El largo casi siempre se repite, así que se deja puesto
    actualizarPreview();
    pintar();
    $('a').focus();
  }

  $('a').oninput = actualizarPreview;
  $('b').oninput = actualizarPreview;
  $('a').onkeydown = e => { if (e.key === 'Enter') $('b').value ? agregar() : $('b').focus(); };
  $('b').onkeydown = e => { if (e.key === 'Enter') agregar(); };
  $('agregar').onclick = agregar;

  $('proveedor').oninput = e => { hoja.proveedor = e.target.value; guardarActual(); };
  $('precio').oninput = e => { hoja.precio = e.target.value; guardarActual(); pintar(); };

  $('guardar').onclick = () => {
    if (hoja.filas.length === 0) { alert('La hoja está vacía.'); return; }
    historial.unshift({
      proveedor: hoja.proveedor,
      precio: hoja.precio,
      filas: hoja.filas.slice(),
      fecha: new Date().toLocaleString('es')
    });
    escribir('historial', historial);
    pintarHistorial();
    alert('Hoja guardada.');
  };

  $('nueva').onclick = () => {
    if (hoja.filas.length && !confirm('¿Empezar una hoja nueva? Lo que no hayas guardado se pierde.')) return;
    hoja = { proveedor: '', precio: hoja.precio, filas: [] };
    guardarActual();
    pintar();
  };

  pintar();
</script>
</body>
</html>
