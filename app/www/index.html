<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a4a1e">
<title>Medir Madera</title>
<style>
  :root {
    --bg: #f4efe8;
    --surface: #ffffff;
    --surface-2: #ece4d9;
    --text: #231a12;
    --muted: #806f5f;
    --line: #e2d7c9;
    --accent: #7a4a1e;
    --accent-2: #a8692e;
    --on-accent: #ffffff;
    --anillo: rgba(168, 105, 46, .28);
    --tinte: #fbf3e8;
    --seleccion: #f3d9b4;
    --key: #ffffff;
    --key-press: #e6dccf;
    --danger: #b3261e;
    --danger-bg: #fbe9e7;
    --flash: #fff1d6;
    --dinero: #2e6b34;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120d;
      --surface: #221b14;
      --surface-2: #2e251c;
      --text: #f3ebe1;
      --muted: #a8988a;
      --line: #3a3026;
      --accent: #c98a4b;
      --accent-2: #e0a568;
      --on-accent: #1a120a;
      --anillo: rgba(224, 165, 104, .30);
      --tinte: #2c2219;
      --seleccion: #6b4a26;
      --key: #2b231b;
      --key-press: #3a3026;
      --danger: #ff8a80;
      --danger-bg: #3a2220;
      --flash: #3d2e1c;
      --dinero: #8fd394;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  input { user-select: text; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
  }
  .vista { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .vista.activa { display: flex; }
  .cargando { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }

  /* Barra de arriba */
  .barra {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(10px + var(--safe-area-inset-top, env(safe-area-inset-top))) 12px 10px 16px;
    background: var(--accent); color: var(--on-accent);
  }
  .barra h1 {
    font-size: 18px; margin: 0; font-weight: 700; white-space: nowrap;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  .barra-botones { display: flex; gap: 6px; flex-shrink: 0; }
  .barra button {
    flex-shrink: 0; color: var(--on-accent); padding: 8px 12px; border-radius: 999px;
    background: rgba(255,255,255,.16); font-size: 15px; font-weight: 600; white-space: nowrap;
  }
  .barra button.principal { background: var(--on-accent); color: var(--accent); }
  .barra button:disabled { opacity: .4; cursor: default; }

  /* Proveedor y totales (en la esquina) */
  .resumen {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .resumen-izq { flex: 1; min-width: 0; }
  .proveedor {
    width: 100%; font-size: 16px; font-weight: 600; color: var(--text);
    border: 0; border-bottom: 1px dashed var(--line); background: transparent;
    padding: 4px 0; outline: none;
  }
  .proveedor:focus { border-bottom-color: var(--accent); }
  .proveedor::placeholder { color: var(--muted); font-weight: 400; }
  .estado { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
  .estado:empty { display: none; }
  .estado button { color: var(--accent); font-weight: 700; font-size: 12px; padding: 2px 0; }
  .totales { flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .totales b { display: block; font-size: 17px; color: var(--dinero); }
  .totales span { font-size: 12px; color: var(--muted); }

  /* Desglose: la última pieza sale arriba */
  .lista { flex: 1; overflow-y: auto; min-height: 0; }
  .pieza {
    display: grid; grid-template-columns: 28px 1fr auto auto 40px; gap: 10px; align-items: center;
    padding: 0 8px 0 16px; height: 52px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .pieza.nueva { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .pieza .n { color: var(--muted); font-size: 13px; }
  .pieza .m { font-size: 19px; font-weight: 600; }
  .pieza .r { font-size: 17px; text-align: right; }
  .pieza .r small { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .pieza .imp { font-size: 14px; color: var(--dinero); text-align: right; }
  .pieza .m, .pieza .r, .pieza .imp { white-space: nowrap; }
  .pieza button {
    width: 36px; height: 36px; border-radius: 50%; justify-self: end;
    background: var(--danger-bg); color: var(--danger); font-size: 15px; font-weight: 700;
  }
  .vacio { color: var(--muted); text-align: center; padding: 32px 24px; line-height: 1.5; }

  /* Panel de captura */
  .captura {
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .campos { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .campo {
    text-align: left; padding: 6px 12px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--bg); opacity: .75;
    transition: box-shadow .15s, border-color .15s, background .15s;
  }
  .campo.activo {
    opacity: 1; border: 3px solid var(--accent); background: var(--tinte);
    box-shadow: 0 0 0 5px var(--anillo); padding: 5px 11px;
  }
  .campo small { display: block; font-size: 12px; color: var(--muted); }
  .campo.activo small { color: var(--accent); font-weight: 700; }
  .valor {
    display: inline-block; font-size: 28px; font-weight: 700; min-height: 34px; line-height: 34px;
    font-variant-numeric: tabular-nums; border-radius: 6px; padding: 0 2px;
  }
  .campo:not(.activo) .valor:empty::after { content: "–"; color: var(--line); }
  /* Cursor que parpadea en la casilla donde se está escribiendo */
  .campo.activo:not(.reemplazar) .valor::after {
    content: ""; display: inline-block; width: 2px; height: 26px; margin-left: 2px;
    background: var(--accent); vertical-align: -3px; animation: parpadeo 1s steps(1) infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0; } }
  /* Al tocar una casilla con número, el número queda marcado: lo que se escriba lo reemplaza */
  .campo.reemplazar .valor { background: var(--seleccion); }
  .por { font-size: 22px; color: var(--muted); }
  .formula { text-align: center; color: var(--muted); font-size: 14px; height: 26px; line-height: 26px; }
  .formula b { color: var(--text); font-size: 16px; }

  .rapidos { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .rapidos button {
    flex: 1; padding: 6px 0; border-radius: 999px; border: 1px solid var(--line);
    font-size: 15px; font-weight: 600; color: var(--text);
  }
  .rapidos button.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .teclado button {
    height: 50px; border-radius: 10px; background: var(--key); border: 1px solid var(--line);
    font-size: 22px; font-weight: 600;
  }
  .teclado button:active { background: var(--key-press); }
  .teclado button:disabled { opacity: .3; cursor: default; }
  .teclado .cero { grid-column: span 2; }
  .teclado .agregar {
    grid-column: 4; grid-row: 2 / span 3; height: auto;
    background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 17px;
  }
  .teclado .agregar:active { background: var(--accent-2); }

  /* Teléfonos más angostos (p. ej. Samsung con "zoom de pantalla"): todo un poco más compacto */
  @media (max-width: 380px) {
    .barra { padding-left: 12px; padding-right: 8px; }
    .barra h1 { font-size: 16px; }
    .barra button { padding: 7px 10px; font-size: 14px; }
    .resumen { padding: 8px 12px; }
    .pieza { grid-template-columns: 22px 1fr auto auto 34px; gap: 6px; padding: 0 6px 0 10px; height: 48px; }
    .pieza .m { font-size: 17px; }
    .pieza .r { font-size: 15px; }
    .pieza .imp { font-size: 13px; }
    .pieza button { width: 32px; height: 32px; }
    .captura { padding-left: 8px; padding-right: 8px; }
    .valor { font-size: 24px; }
    .teclado { gap: 5px; }
    .teclado button { height: 46px; font-size: 20px; }
    .rapidos { gap: 4px; }
    .rapidos button { font-size: 14px; }
    .sumar-zona .suma { grid-template-columns: 1fr 1fr; }
    .sumar-zona .suma div:last-child { grid-column: span 2; }
  }

  /* Hojas guardadas */
  .sumar-zona { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .sumar-zona[hidden] { display: none; }
  .btn-sumar {
    width: 100%; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 700;
    background: var(--surface-2);
  }
  .sumar-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-sumar.activo { background: var(--accent); color: var(--on-accent); }
  .suma-titulo {
    display: flex; justify-content: space-between; align-items: center; margin-top: 10px;
    font-size: 13px; font-weight: 700; color: var(--muted);
  }
  .suma-titulo button { color: var(--muted); font-size: 16px; padding: 2px 6px; }
  .suma {
    display: grid; grid-template-columns: auto 1fr 1.4fr; gap: 8px; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .suma[hidden] { display: none; }
  .suma div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .suma small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .suma b { font-size: 18px; }
  .suma .din { color: var(--dinero); }
  .hoja-guardada { padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .hg-arriba { display: flex; align-items: flex-start; gap: 8px; }
  .hoja-guardada .info { flex: 1; min-width: 0; }
  .hoja-guardada .info b { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hoja-guardada .info small { color: var(--muted); font-size: 13px; }
  .hoja-guardada .info .din { display: block; color: var(--dinero); font-weight: 700; font-size: 16px; margin-top: 2px; }
  .hoja-guardada .quitar {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--danger-bg); color: var(--danger); font-size: 14px; font-weight: 700;
  }
  .hg-botones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .hg-botones button {
    padding: 9px 4px; border-radius: 8px; background: var(--surface-2);
    font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .hg-botones .abrir { background: var(--accent); color: var(--on-accent); }

  /* Elegir hojas para sumarlas */
  .hoja-guardada.seleccionable { cursor: pointer; }
  .hoja-guardada.elegida { background: var(--tinte); }
  .marca {
    flex-shrink: 0; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: transparent;
  }
  .elegida .marca { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .barra-seleccion {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .barra-seleccion[hidden] { display: none; }
  .barra-seleccion span { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); }
  .barra-seleccion button {
    flex-shrink: 0; padding: 11px 14px; border-radius: 10px; font-size: 15px; font-weight: 700;
    background: var(--surface-2); white-space: nowrap;
  }
  .barra-seleccion .principal { background: var(--accent); color: var(--on-accent); }
  .barra-seleccion .principal:disabled { opacity: .4; cursor: default; }

  /* Vista previa del PDF (sin descargarlo) */
  .visor {
    position: fixed; inset: 0; z-index: 15; background: #5b5148;
    display: flex; flex-direction: column;
  }
  .visor[hidden] { display: none; }
  .visor .barra h1 { flex: 1; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
  .visor .zoom { display: flex; gap: 4px; flex-shrink: 0; }
  .visor .zoom button { width: 38px; padding: 8px 0; font-size: 17px; }
  .visor-paginas { flex: 1; overflow: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
  .visor-paginas canvas {
    display: block; width: 100%; margin: 0 auto 12px; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .visor-paginas .vacio { color: #f3ebe1; }
  .visor-pie {
    display: grid; grid-template-columns: 1fr; padding: 10px 12px calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    background: var(--surface);
  }
  .visor-pie button {
    padding: 12px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
    font-size: 16px; font-weight: 700;
  }

  /* Aviso con deshacer */
  .aviso {
    position: fixed; left: 50%; bottom: calc(24px + var(--safe-area-inset-bottom, 0px)); transform: translate(-50%, 200px);
    background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 10px;
    display: flex; gap: 16px; align-items: center; font-size: 15px;
    transition: transform .2s; max-width: calc(100% - 32px); z-index: 10;
  }
  .aviso.ver { transform: translate(-50%, 0); }
  .aviso button { color: var(--accent-2); font-weight: 700; }
  .aviso button:empty { display: none; }
  @media (prefers-color-scheme: dark) { .aviso button { color: var(--accent); } }
  .aviso span { white-space: nowrap; }

  /* Menú del PDF */
  .fondo {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .fondo[hidden] { display: none; }
  .menu {
    width: 100%; max-width: 480px; background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 16px 12px calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    display: grid; gap: 8px;
  }
  .menu h2 { margin: 0 4px 4px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
    border-radius: 12px; background: var(--bg); font-size: 17px; font-weight: 600; text-align: left;
  }
  .menu button:active { background: var(--surface-2); }
  .menu .whatsapp { background: #25d366; color: #ffffff; }
  .menu .whatsapp:active { background: #1ebe5b; }
  .menu .cancelar { background: transparent; justify-content: center; color: var(--muted); }
  .menu .ico { font-size: 22px; width: 26px; text-align: center; }
</style>
</head>
<body>
<div class="app">

  <div class="cargando" id="cargando">Abriendo…</div>

  <!-- Vista: hoja actual -->
  <section class="vista" id="vistaHoja">
    <header class="barra">
      <h1>🪵 Medir Madera</h1>
      <div class="barra-botones">
        <button class="principal" id="guardar">Guardar</button>
        <button id="irGuardadas">Guardadas</button>
      </div>
    </header>

    <div class="resumen">
      <div class="resumen-izq">
        <input class="proveedor" id="proveedor" placeholder="Proveedor" autocomplete="off">
        <div class="estado" id="estado"></div>
      </div>
      <div class="totales">
        <b id="pagar">₡0,00</b>
        <span><span id="total">0</span> pulg · <span id="piezas">0</span> pzs</span>
      </div>
    </div>

    <div class="lista" id="lista"></div>

    <div class="captura">
      <div class="campos">
        <button class="campo activo" id="campoA"><small>Medida</small><span class="valor" id="valA"></span></button>
        <div class="por">×</div>
        <button class="campo" id="campoB"><small>Largo</small><span class="valor" id="valB"></span></button>
      </div>
      <div class="formula" id="formula"></div>
      <div class="rapidos">
        <span>Largo:</span>
        <button data-largo="2">2</button>
        <button data-largo="3">3</button>
        <button data-largo="4">4</button>
        <button data-largo="5">5</button>
        <button data-largo="6">6</button>
      </div>
      <div class="teclado" id="teclado">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="borrar" aria-label="Borrar">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="agregar" class="agregar">Agregar</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k=".">.</button><button data-k="0" class="cero">0</button>
      </div>
    </div>
  </section>

  <!-- Vista: hojas guardadas -->
  <section class="vista" id="vistaGuardadas">
    <header class="barra">
      <h1>Hojas guardadas</h1>
      <button id="volver">← Volver</button>
    </header>
    <div class="sumar-zona" id="sumarZona" hidden>
      <div class="sumar-botones">
        <button class="btn-sumar" id="sumarTodas">∑ Sumar todas</button>
        <button class="btn-sumar" id="modoSeleccion">☑ Seleccionar</button>
      </div>
      <div id="resultadoSuma" hidden>
        <div class="suma-titulo"><span id="sumaTitulo">Todas las hojas</span><button id="cerrarSuma" aria-label="Cerrar suma">✕</button></div>
        <div class="suma" id="suma">
          <div><small>Hojas</small><b id="sumaHojas">0</b></div>
          <div><small>Pulgadas</small><b id="sumaPulgadas">0</b></div>
          <div><small>Total</small><b class="din" id="sumaColones">₡0,00</b></div>
        </div>
      </div>
    </div>
    <div class="lista" id="listaGuardadas"></div>
    <div class="barra-seleccion" id="barraSeleccion" hidden>
      <span id="cuentaSeleccion">Toque las hojas que quiere sumar</span>
      <button id="cancelarSeleccion">Cancelar</button>
      <button class="principal" id="sumarSeleccion" disabled>Sumar</button>
    </div>
  </section>

</div>

<div class="visor" id="visor" hidden>
  <header class="barra">
    <button id="visorCerrar">← Cerrar</button>
    <h1 id="visorTitulo">Vista previa</h1>
    <div class="zoom">
      <button id="zoomMenos" aria-label="Alejar">−</button>
      <button id="zoomMas" aria-label="Acercar">+</button>
    </div>
  </header>
  <div class="visor-paginas" id="visorPaginas"></div>
  <div class="visor-pie"><button id="visorEnviar">📤 Enviar o descargar</button></div>
</div>

<div class="aviso" id="aviso"><span id="avisoTexto"></span><button id="avisoBoton"></button></div>

<div class="fondo" id="menuPdf" hidden>
  <div class="menu">
    <h2 id="menuPdfTitulo">PDF de la hoja</h2>
    <button class="whatsapp" data-pdf="whatsapp"><span class="ico">💬</span>Mandar por WhatsApp</button>
    <button data-pdf="descargar"><span class="ico">⬇️</span>Descargar al teléfono</button>
    <button data-pdf="otros"><span class="ico">📤</span>Otras opciones (correo, Drive, imprimir…)</button>
    <button class="cancelar" data-pdf="cancelar">Cancelar</button>
  </div>
</div>

<script src="capacitor.js"></script>
<script src="jspdf.umd.min.js"></script>
<script>
  const { Capacitor, registerPlugin } = capacitorExports;
  const esNativo = Capacitor.isNativePlatform();

  // Fórmula de la hoja: medida × medida × largo ÷ 4
  const calcular = (a, b) => a * a * b / 4;
  const fmt = n => Number(n.toFixed(2)).toLocaleString('es', { useGrouping: 'always' });
  const moneda = (n, simbolo) =>
    simbolo + n.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
  const dinero = n => moneda(n, '₡');
  const $ = id => document.getElementById(id);

  // Precio por unidad: de 8 para abajo vale uno, de 9 para arriba vale otro
  let precios = { bajo: 80, alto: 100 };
  const precioPara = medida => medida <= 8 ? precios.bajo : precios.alto;

  /* ---------- Base de datos SQLite ---------- */

  const BD = 'madera';
  let consulta, ejecutar;

  function cargarScript(src) {
    return new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = mal;
      document.head.appendChild(s);
    });
  }

  async function abrirBase() {
    if (esNativo) {
      // En el teléfono: SQLite de Android, guardado en el aparato
      const S = registerPlugin('CapacitorSQLite');
      try {
        await S.createConnection({ database: BD, version: 1, encrypted: false, mode: 'no-encryption', readonly: false });
      } catch (e) { /* la conexión ya existía */ }
      await S.open({ database: BD, readonly: false });
      consulta = async (sql, v = []) =>
        (await S.query({ database: BD, statement: sql, values: v, readonly: false })).values || [];
      ejecutar = async (sql, v = []) =>
        (await S.run({ database: BD, statement: sql, values: v, transaction: true, readonly: false })).changes.lastId;
    } else {
      // En la computadora (solo para probar): SQLite en memoria con sql.js
      const cdn = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
      await cargarScript(cdn + 'sql-wasm.js');
      const SQL = await initSqlJs({ locateFile: f => cdn + f });
      const base = new SQL.Database();
      consulta = async (sql, v = []) => {
        const st = base.prepare(sql);
        st.bind(v);
        const filas = [];
        while (st.step()) filas.push(st.getAsObject());
        st.free();
        return filas;
      };
      ejecutar = async (sql, v = []) => {
        base.run(sql, v);
        return base.exec('SELECT last_insert_rowid()')[0].values[0][0];
      };
    }

    await ejecutar(`CREATE TABLE IF NOT EXISTS hojas (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      proveedor TEXT NOT NULL DEFAULT '',
      fecha TEXT,
      guardada INTEGER NOT NULL DEFAULT 0
    )`);
    await ejecutar(`CREATE TABLE IF NOT EXISTS piezas (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      hoja_id INTEGER NOT NULL,
      medida REAL NOT NULL,
      largo REAL NOT NULL
    )`);
    await ejecutar('CREATE TABLE IF NOT EXISTS ajustes (clave TEXT PRIMARY KEY, valor TEXT)');

    // Versión 2: cada pieza guarda su precio, para que las hojas viejas no cambien si sube el precio
    const columnas = await consulta('PRAGMA table_info(piezas)');
    if (!columnas.some(c => c.name === 'precio')) {
      await ejecutar('ALTER TABLE piezas ADD COLUMN precio REAL');
      await ejecutar('UPDATE piezas SET precio = CASE WHEN medida <= 8 THEN 80 ELSE 100 END');
    }

    const bajo = await leerAjuste('precio_bajo'), alto = await leerAjuste('precio_alto');
    if (bajo !== null) precios.bajo = Number(bajo);
    if (alto !== null) precios.alto = Number(alto);
  }

  async function leerAjuste(clave) {
    const f = await consulta('SELECT valor FROM ajustes WHERE clave = ?', [clave]);
    return f.length ? f[0].valor : null;
  }
  const fijarAjuste = (clave, valor) =>
    ejecutar('INSERT OR REPLACE INTO ajustes (clave, valor) VALUES (?, ?)', [clave, String(valor)]);

  async function cargarHoja(id) {
    const h = (await consulta('SELECT id, proveedor, fecha, guardada FROM hojas WHERE id = ?', [id]))[0];
    if (!h) return null;
    const filas = await consulta(
      'SELECT id, medida AS a, largo AS b, precio AS p FROM piezas WHERE hoja_id = ? ORDER BY id', [id]);
    return { id: h.id, proveedor: h.proveedor, fecha: h.fecha, guardada: !!h.guardada, filas };
  }

  async function crearHoja() {
    const id = await ejecutar("INSERT INTO hojas (proveedor) VALUES ('')");
    await fijarAjuste('hoja_actual', id);
    return { id, proveedor: '', fecha: null, guardada: false, filas: [] };
  }

  async function borrarHojaDeBase(id) {
    await ejecutar('DELETE FROM piezas WHERE hoja_id = ?', [id]);
    await ejecutar('DELETE FROM hojas WHERE id = ?', [id]);
  }

  async function restaurarHoja(h) {
    await ejecutar('INSERT INTO hojas (id, proveedor, fecha, guardada) VALUES (?, ?, ?, ?)',
      [h.id, h.proveedor, h.fecha, h.guardada ? 1 : 0]);
    for (const f of h.filas)
      await ejecutar('INSERT INTO piezas (id, hoja_id, medida, largo, precio) VALUES (?, ?, ?, ?, ?)',
        [f.id, h.id, f.a, f.b, f.p]);
  }

  /* ---------- Hoja actual ---------- */

  let hoja;
  let entrada = { a: '', b: '4' };
  let campo = 'a';
  let reemplazar = false;

  const importe = f => calcular(f.a, f.b) * f.p;
  const totalDe = h => h.filas.reduce((s, f) => s + calcular(f.a, f.b), 0);
  const pagarDe = h => h.filas.reduce((s, f) => s + importe(f), 0);

  function pintarHoja(resaltarUltima) {
    $('proveedor').value = hoja.proveedor;
    $('total').textContent = fmt(totalDe(hoja));
    $('pagar').textContent = dinero(pagarDe(hoja));
    $('piezas').textContent = hoja.filas.length;
    $('guardar').disabled = hoja.filas.length === 0;
    $('guardar').textContent = hoja.guardada ? 'Listo' : 'Guardar';

    const estado = $('estado');
    estado.innerHTML = '';
    if (hoja.guardada) {
      estado.innerHTML = '<span>Guardada</span><button id="verActual">👁 Ver PDF</button>' +
        '<button id="pdfActual">📤 Enviar</button>';
      $('verActual').onclick = () => verPDF(hoja);
      $('pdfActual').onclick = () => crearPDF(hoja);
    }

    // Desglose: la última pieza sale de primera, para ver y borrar rápido si hubo un error
    const lista = $('lista');
    lista.innerHTML = '';
    if (hoja.filas.length === 0) {
      lista.innerHTML = '<div class="vacio">Escribe la medida y el largo con el teclado de abajo y toca <b>Agregar</b>.<br>Aquí van saliendo las piezas.</div>';
      return;
    }
    for (let i = hoja.filas.length - 1; i >= 0; i--) {
      const f = hoja.filas[i];
      const fila = document.createElement('div');
      fila.className = 'pieza' + (resaltarUltima && i === hoja.filas.length - 1 ? ' nueva' : '');
      fila.innerHTML =
        '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="m">' + fmt(f.a) + ' × ' + fmt(f.b) + '</span>' +
        '<span class="r">' + fmt(calcular(f.a, f.b)) + '<small>pulg</small></span>' +
        '<span class="imp">' + dinero(importe(f)) + '</span>' +
        '<button aria-label="Borrar pieza">✕</button>';
      fila.querySelector('button').onclick = () => quitarPieza(i);
      lista.appendChild(fila);
    }
    if (resaltarUltima) lista.scrollTop = 0;
  }

  async function quitarPieza(i) {
    const [quitada] = hoja.filas.splice(i, 1);
    pintarHoja();
    await ejecutar('DELETE FROM piezas WHERE id = ?', [quitada.id]);
    const h = hoja;
    avisar('Pieza ' + fmt(quitada.a) + ' × ' + fmt(quitada.b) + ' borrada', async () => {
      await ejecutar('INSERT INTO piezas (id, hoja_id, medida, largo, precio) VALUES (?, ?, ?, ?, ?)',
        [quitada.id, h.id, quitada.a, quitada.b, quitada.p]);
      h.filas.splice(i, 0, quitada);
      if (h === hoja) pintarHoja();
    });
  }

  /* ---------- Captura ---------- */

  function pintarEntrada() {
    $('valA').textContent = entrada.a;
    $('valB').textContent = entrada.b;
    $('campoA').classList.toggle('activo', campo === 'a');
    $('campoB').classList.toggle('activo', campo === 'b');
    $('campoA').classList.toggle('reemplazar', reemplazar && campo === 'a');
    $('campoB').classList.toggle('reemplazar', reemplazar && campo === 'b');
    document.querySelectorAll('[data-largo]').forEach(b =>
      b.classList.toggle('sel', b.dataset.largo === entrada.b));
    document.querySelector('[data-k="."]').disabled = campo === 'a';
    const a = parseFloat(entrada.a), b = parseFloat(entrada.b);
    $('formula').innerHTML = (a > 0 && b > 0)
      ? fmt(a) + ' × ' + fmt(a) + ' × ' + fmt(b) + ' ÷ 4 = <b>' + fmt(calcular(a, b)) + ' pulg</b> · ' +
        dinero(calcular(a, b) * precioPara(a))
      : '';
  }

  // Al tocar una casilla que ya tiene número, lo próximo que se escriba lo reemplaza (no se pega al lado)
  function elegirCampo(c) {
    campo = c;
    reemplazar = entrada[c] !== '';
    pintarEntrada();
  }

  function tecla(k) {
    if (k === 'agregar') return agregar();
    // La medida de la tuca siempre es entera; solo el largo acepta decimales
    if (k === '.' && campo === 'a') return;
    let v = reemplazar ? '' : entrada[campo];
    reemplazar = false;
    if (k === 'borrar') v = v.slice(0, -1);
    else if (k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
    else if (v.length < 6) v = (v === '0' ? '' : v) + k;
    entrada[campo] = v;
    pintarEntrada();
  }

  async function agregar() {
    const a = parseFloat(entrada.a), b = parseFloat(entrada.b);
    if (!(a > 0)) { elegirCampo('a'); return; }
    if (!(b > 0)) { elegirCampo('b'); return; }
    const p = precioPara(a);
    // El largo casi siempre se repite, así que se queda puesto
    entrada.a = '';
    campo = 'a';
    reemplazar = false;
    pintarEntrada();
    const id = await ejecutar('INSERT INTO piezas (hoja_id, medida, largo, precio) VALUES (?, ?, ?, ?)',
      [hoja.id, a, b, p]);
    hoja.filas.push({ id, a, b, p });
    pintarHoja(true);
  }

  $('teclado').onclick = e => { const b = e.target.closest('button'); if (b) tecla(b.dataset.k); };
  $('campoA').onclick = () => elegirCampo('a');
  $('campoB').onclick = () => elegirCampo('b');
  document.querySelectorAll('[data-largo]').forEach(b => b.onclick = () => {
    entrada.b = b.dataset.largo;
    campo = 'a';
    reemplazar = false;
    pintarEntrada();
  });

  // Teclado físico (en computadora)
  document.addEventListener('keydown', e => {
    if (document.activeElement === $('proveedor')) {
      if (e.key === 'Enter') $('proveedor').blur();
      return;
    }
    if (!$('vistaHoja').classList.contains('activa')) return;
    if (/^[0-9]$/.test(e.key)) tecla(e.key);
    else if (e.key === '.' || e.key === ',') tecla('.');
    else if (e.key === 'Backspace') tecla('borrar');
    else if (e.key === 'Enter') { e.preventDefault(); tecla('agregar'); }
    else if (e.key === 'x' || e.key === '*' || e.key === 'Tab') {
      e.preventDefault(); elegirCampo(campo === 'a' ? 'b' : 'a');
    }
  });

  $('proveedor').oninput = e => {
    hoja.proveedor = e.target.value;
    ejecutar('UPDATE hojas SET proveedor = ? WHERE id = ?', [hoja.proveedor, hoja.id]);
  };

  /* ---------- Guardar y hojas guardadas ---------- */

  $('guardar').onclick = async () => {
    if (hoja.filas.length === 0) return;
    const anterior = hoja;
    const yaEstabaGuardada = anterior.guardada;
    if (!yaEstabaGuardada) {
      anterior.fecha = new Date().toISOString();
      anterior.guardada = true;
      await ejecutar('UPDATE hojas SET guardada = 1, fecha = ? WHERE id = ?', [anterior.fecha, anterior.id]);
    }
    hoja = await crearHoja();
    pintarHoja();
    const nueva = hoja;
    avisar(yaEstabaGuardada ? 'Listo' : 'Hoja guardada', async () => {
      await borrarHojaDeBase(nueva.id);
      if (!yaEstabaGuardada) {
        anterior.guardada = false;
        anterior.fecha = null;
        await ejecutar('UPDATE hojas SET guardada = 0, fecha = NULL WHERE id = ?', [anterior.id]);
      }
      await fijarAjuste('hoja_actual', anterior.id);
      hoja = anterior;
      pintarHoja();
    });
  };

  function fechaCorta(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('es', { day: 'numeric', month: 'short' }) +
      ' · ' + d.toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit' });
  }

  async function pintarGuardadas() {
    const guardadas = await consulta(`
      SELECT h.id, h.proveedor, h.fecha,
             COUNT(p.id) AS piezas,
             COALESCE(SUM(p.medida * p.medida * p.largo / 4), 0) AS pulgadas,
             COALESCE(SUM(p.medida * p.medida * p.largo / 4 * p.precio), 0) AS pagar
      FROM hojas h LEFT JOIN piezas p ON p.hoja_id = h.id
      WHERE h.guardada = 1
      GROUP BY h.id
      ORDER BY h.fecha DESC`);
    guardadasActuales = guardadas;
    for (const id of [...seleccion]) if (!guardadas.some(h => h.id === id)) seleccion.delete(id);
    $('sumarZona').hidden = guardadas.length === 0;
    if (guardadas.length === 0) salirDeSeleccion();
    if (sumaVisible) mostrarSuma(sumaVisible);
    pintarBarraSeleccion();
    const lista = $('listaGuardadas');
    lista.innerHTML = '';
    if (guardadas.length === 0) {
      lista.innerHTML = '<div class="vacio">Aún no hay hojas guardadas.</div>';
      return;
    }
    guardadas.forEach(h => {
      const fila = document.createElement('div');
      fila.className = 'hoja-guardada';
      if (seleccionando) {
        // Modo seleccionar: tocar la hoja la marca o la desmarca
        fila.classList.add('seleccionable');
        fila.classList.toggle('elegida', seleccion.has(h.id));
        fila.innerHTML =
          '<div class="hg-arriba">' +
            '<span class="marca">✓</span>' +
            '<div class="info"><b></b><small></small><span class="din"></span></div>' +
          '</div>';
        fila.onclick = () => {
          if (seleccion.has(h.id)) seleccion.delete(h.id); else seleccion.add(h.id);
          fila.classList.toggle('elegida', seleccion.has(h.id));
          pintarBarraSeleccion();
          if (sumaVisible === 'seleccion') mostrarSuma('seleccion');
        };
      } else {
        fila.innerHTML =
          '<div class="hg-arriba">' +
            '<div class="info"><b></b><small></small><span class="din"></span></div>' +
            '<button class="quitar" aria-label="Borrar hoja">✕</button>' +
          '</div>' +
          '<div class="hg-botones">' +
            '<button class="abrir">Abrir</button>' +
            '<button class="ver">👁 Ver PDF</button>' +
            '<button class="enviar">📤 Enviar</button>' +
          '</div>';
      }
      fila.querySelector('b').textContent = h.proveedor || 'Sin proveedor';
      fila.querySelector('small').textContent =
        fechaCorta(h.fecha) + ' · ' + h.piezas + ' pzs · ' + fmt(h.pulgadas) + ' pulg';
      fila.querySelector('.din').textContent = dinero(h.pagar);
      if (!seleccionando) {
        fila.querySelector('.abrir').onclick = () => abrirGuardada(h.id);
        fila.querySelector('.ver').onclick = async () => verPDF(await cargarHoja(h.id));
        fila.querySelector('.enviar').onclick = async () => crearPDF(await cargarHoja(h.id));
        fila.querySelector('.quitar').onclick = () => borrarGuardada(h.id);
      }
      lista.appendChild(fila);
    });
  }

  /* ---------- Sumar hojas: todas o solo las seleccionadas ---------- */

  let guardadasActuales = [];
  let seleccionando = false;
  let sumaVisible = null;   // 'todas', 'seleccion' o null
  const seleccion = new Set();

  const elegidas = () => guardadasActuales.filter(h => seleccion.has(h.id));

  // Cuántas hojas, cuántas pulgadas y cuántos colones
  function mostrarSuma(tipo) {
    const hojas = tipo === 'todas' ? guardadasActuales : elegidas();
    sumaVisible = tipo;
    $('sumaTitulo').textContent = tipo === 'todas'
      ? 'Todas las hojas'
      : (hojas.length === 1 ? '1 hoja seleccionada' : hojas.length + ' hojas seleccionadas');
    $('sumaHojas').textContent = hojas.length;
    $('sumaPulgadas').textContent = fmt(hojas.reduce((s, h) => s + h.pulgadas, 0));
    $('sumaColones').textContent = dinero(hojas.reduce((s, h) => s + h.pagar, 0));
    $('resultadoSuma').hidden = false;
  }
  function cerrarSuma() {
    sumaVisible = null;
    $('resultadoSuma').hidden = true;
  }

  function pintarBarraSeleccion() {
    $('barraSeleccion').hidden = !seleccionando;
    $('modoSeleccion').classList.toggle('activo', seleccionando);
    $('modoSeleccion').textContent = seleccionando ? '☑ Seleccionando' : '☑ Seleccionar';
    const n = seleccion.size;
    $('cuentaSeleccion').textContent = n === 0
      ? 'Toque las hojas que quiere sumar'
      : (n === 1 ? '1 hoja' : n + ' hojas') + ' · ' + fmt(elegidas().reduce((s, h) => s + h.pulgadas, 0)) + ' pulg';
    $('sumarSeleccion').disabled = n === 0;
    $('sumarSeleccion').textContent = n === 0 ? 'Sumar' : 'Sumar (' + n + ')';
  }

  function salirDeSeleccion() {
    seleccionando = false;
    seleccion.clear();
    if (sumaVisible === 'seleccion') cerrarSuma();
  }

  $('sumarTodas').onclick = () => mostrarSuma('todas');
  $('cerrarSuma').onclick = cerrarSuma;
  $('modoSeleccion').onclick = () => {
    if (seleccionando) salirDeSeleccion(); else seleccionando = true;
    pintarGuardadas();
  };
  $('cancelarSeleccion').onclick = () => { salirDeSeleccion(); pintarGuardadas(); };
  $('sumarSeleccion').onclick = () => mostrarSuma('seleccion');

  async function borrarGuardada(id) {
    const completa = await cargarHoja(id);
    await borrarHojaDeBase(id);
    if (hoja.id === id) hoja = await crearHoja();
    await pintarGuardadas();
    avisar('Hoja borrada', async () => {
      await restaurarHoja(completa);
      await pintarGuardadas();
    });
  }

  async function abrirGuardada(id) {
    if (hoja.id !== id && !hoja.guardada) {
      if (hoja.filas.length &&
          !confirm('La hoja que estás llenando no está guardada y se va a perder. ¿Abrir esta de todos modos?')) return;
      await borrarHojaDeBase(hoja.id);
    }
    await fijarAjuste('hoja_actual', id);
    hoja = await cargarHoja(id);
    mostrar('vistaHoja');
  }

  function mostrar(id) {
    document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === id));
    if (id === 'vistaHoja') pintarHoja(); else pintarGuardadas();
  }
  $('irGuardadas').onclick = () => mostrar('vistaGuardadas');
  $('volver').onclick = () => { salirDeSeleccion(); mostrar('vistaHoja'); };

  /* ---------- PDF ---------- */

  // Las letras que trae el PDF no tienen el símbolo ₡, así que se mete DejaVu Sans (letra libre)
  let fuentes = null;
  async function cargarFuentes() {
    if (fuentes) return fuentes;
    const base64 = async archivo => {
      const bytes = new Uint8Array(await (await fetch('fuentes/' + archivo)).arrayBuffer());
      let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    };
    fuentes = { normal: await base64('DejaVuSans.ttf'), bold: await base64('DejaVuSans-Bold.ttf') };
    return fuentes;
  }

  function dibujarPDF(h, fuentes) {
    const doc = new jspdf.jsPDF({ unit: 'mm', format: 'letter' });
    doc.addFileToVFS('DejaVuSans.ttf', fuentes.normal);
    doc.addFont('DejaVuSans.ttf', 'DejaVu', 'normal');
    doc.addFileToVFS('DejaVuSans-Bold.ttf', fuentes.bold);
    doc.addFont('DejaVuSans-Bold.ttf', 'DejaVu', 'bold');
    const izq = 15, der = 200, alto = 279;
    const fecha = new Date(h.fecha || Date.now());
    const cols = [
      { t: 'No.', x: izq, w: 14, al: 'center' },
      { t: 'MEDIDA', x: izq + 14, w: 50, al: 'center' },
      { t: 'PULGADAS', x: izq + 64, w: 42, al: 'right' },
      { t: 'PRECIO', x: izq + 106, w: 32, al: 'right' },
      { t: 'IMPORTE', x: izq + 138, w: 47, al: 'right' },
    ];
    const fila = 8;
    let y;

    function texto(t, c, yy) {
      const x = c.al === 'center' ? c.x + c.w / 2 : c.al === 'right' ? c.x + c.w - 2 : c.x + 2;
      doc.text(String(t), x, yy, { align: c.al });
    }

    function encabezado(pagina) {
      doc.setFont('DejaVu', 'bold'); doc.setFontSize(20);
      doc.text('HOJA DE MADERA', izq, 22);
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(10);
      doc.text('Fecha: ' + fecha.toLocaleDateString('es', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        '   Hoja No. ' + h.id + (pagina > 1 ? '   (pág. ' + pagina + ')' : ''), der, 22, { align: 'right' });

      doc.setLineWidth(0.4);
      doc.rect(izq, 28, der - izq, 10);
      doc.setFont('DejaVu', 'bold'); doc.setFontSize(10);
      doc.text('PROVEEDOR:', izq + 3, 34.5);
      const xNombre = izq + 3 + doc.getTextWidth('PROVEEDOR:') + 3;
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(12);
      doc.text(h.proveedor || '', xNombre, 34.5);

      y = 44;
      doc.setFillColor(235, 228, 218);
      doc.rect(izq, y, der - izq, fila, 'FD');
      doc.setFont('DejaVu', 'bold'); doc.setFontSize(9);
      cols.forEach(c => texto(c.t, c, y + 5.5));
      cols.slice(1).forEach(c => doc.line(c.x, y, c.x, y + fila));
      y += fila;
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(11);
    }

    let pagina = 1;
    encabezado(pagina);
    h.filas.forEach((f, i) => {
      if (y + fila > alto - 40) { doc.addPage(); encabezado(++pagina); }
      doc.setLineWidth(0.2);
      doc.rect(izq, y, der - izq, fila);
      cols.slice(1).forEach(c => doc.line(c.x, y, c.x, y + fila));
      const v = [String(i + 1).padStart(2, '0'), fmt(f.a) + ' x ' + fmt(f.b),
                 fmt(calcular(f.a, f.b)), dinero(f.p), dinero(importe(f))];
      cols.forEach((c, j) => texto(v[j], c, y + 5.5));
      y += fila;
    });

    // Totales
    if (y + 34 > alto) { doc.addPage(); encabezado(++pagina); }
    const cajaX = izq + 106, cajaY = y + 6;
    doc.setLineWidth(0.4);
    doc.rect(cajaX, cajaY, der - cajaX, 28);
    doc.setFont('DejaVu', 'normal'); doc.setFontSize(10);
    doc.text('Piezas', cajaX + 3, cajaY + 6.5);
    doc.text(String(h.filas.length), der - 3, cajaY + 6.5, { align: 'right' });
    doc.text('Total de pulgadas', cajaX + 3, cajaY + 13);
    doc.setFont('DejaVu', 'bold');
    doc.text(fmt(totalDe(h)), der - 3, cajaY + 13, { align: 'right' });
    doc.setLineWidth(0.2);
    doc.line(cajaX, cajaY + 16, der, cajaY + 16);
    doc.setFontSize(10);
    doc.text('A PAGAR', cajaX + 3, cajaY + 24);
    doc.setFontSize(15);
    doc.text(dinero(pagarDe(h)), der - 3, cajaY + 24.5, { align: 'right' });
    return doc;
  }

  // Vista previa: dibuja el PDF dentro de la app con pdf.js, sin guardar ningún archivo
  let hojaDelVisor = null, zoom = 1;
  async function verPDF(h) {
    if (!h || h.filas.length === 0) return;
    hojaDelVisor = h;
    zoom = 1;
    $('visorTitulo').textContent = h.proveedor || 'Sin proveedor';
    const cont = $('visorPaginas');
    cont.innerHTML = '<div class="vacio">Preparando el PDF…</div>';
    $('visor').hidden = false;
    try {
      if (!window.pdfjsLib) await cargarScript('pdfjs/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
      const datos = dibujarPDF(h, await cargarFuentes()).output('arraybuffer');
      const pdf = await pdfjsLib.getDocument({ data: datos }).promise;
      cont.innerHTML = '';
      for (let n = 1; n <= pdf.numPages; n++) {
        const pagina = await pdf.getPage(n);
        const vp = pagina.getViewport({ scale: 3 });
        const lienzo = document.createElement('canvas');
        lienzo.width = vp.width; lienzo.height = vp.height;
        cont.appendChild(lienzo);
        await pagina.render({ canvasContext: lienzo.getContext('2d'), viewport: vp }).promise;
      }
      aplicarZoom();
    } catch (e) {
      cont.innerHTML = '<div class="vacio">No se pudo mostrar el PDF: ' + (e.message || e) + '</div>';
    }
  }
  function aplicarZoom() {
    $('visorPaginas').querySelectorAll('canvas').forEach(c => c.style.width = (zoom * 100) + '%');
  }
  const cerrarVisor = () => { $('visor').hidden = true; $('visorPaginas').innerHTML = ''; };
  $('visorCerrar').onclick = cerrarVisor;
  $('zoomMas').onclick = () => { zoom = Math.min(3, zoom + 0.5); aplicarZoom(); };
  $('zoomMenos').onclick = () => { zoom = Math.max(1, zoom - 0.5); aplicarZoom(); };
  $('visorEnviar').onclick = () => crearPDF(hojaDelVisor);

  // El botón Enviar abre un menú: WhatsApp, Descargar u otras opciones
  let hojaDelMenu = null;
  function crearPDF(h) {
    if (!h || h.filas.length === 0) return;
    hojaDelMenu = h;
    $('menuPdfTitulo').textContent = 'PDF de la hoja · ' + (h.proveedor || 'Sin proveedor');
    $('menuPdf').hidden = false;
  }
  const cerrarMenuPdf = () => { $('menuPdf').hidden = true; };
  $('menuPdf').onclick = e => {
    const b = e.target.closest('[data-pdf]');
    if (e.target === $('menuPdf') || b) cerrarMenuPdf();
    if (b && b.dataset.pdf !== 'cancelar') hacerPDF(hojaDelMenu, b.dataset.pdf);
  };

  async function hacerPDF(h, como) {
    const doc = dibujarPDF(h, await cargarFuentes());
    const nombre = ('Hoja ' + h.id + ' ' + (h.proveedor || 'sin proveedor'))
      .replace(/[^\wáéíóúñÁÉÍÓÚÑ ]+/g, '').trim().replace(/\s+/g, '_') + '.pdf';
    if (!esNativo) { doc.save(nombre); return; }
    try {
      const Filesystem = registerPlugin('Filesystem');
      const Pdf = registerPlugin('Pdf');
      await Filesystem.writeFile({ path: nombre, data: doc.output('datauristring').split(',')[1], directory: 'CACHE' });
      const { uri } = await Filesystem.getUri({ path: nombre, directory: 'CACHE' });

      if (como === 'whatsapp') {
        try { await Pdf.whatsapp({ ruta: uri }); return; }
        catch (e) {
          if (e.code !== 'SIN_WHATSAPP') throw e;
          alert('WhatsApp no está instalado en este teléfono. Se abrirán las otras opciones.');
          como = 'otros';
        }
      }
      if (como === 'descargar') {
        try {
          const r = await Pdf.descargar({ ruta: uri, nombre });
          avisar('Guardado en Descargas', () => Pdf.abrir({ uri: r.uri })
            .catch(() => alert('No hay una app para abrir PDF en este teléfono.')), 'Abrir');
          return;
        } catch (e) {
          if (e.code !== 'ANDROID_VIEJO') throw e;
          como = 'otros';
        }
      }
      // Menú de compartir de Android: correo, Drive, imprimir, guardar en archivos…
      await registerPlugin('Share').share({ title: nombre, url: uri, dialogTitle: 'Compartir hoja en PDF' });
    } catch (e) {
      if (!/cancel/i.test(e.message || '')) alert('No se pudo crear el PDF: ' + (e.message || e));
    }
  }

  /* ---------- Aviso con deshacer ---------- */

  let temporizador, accionDeshacer;
  function avisar(texto, deshacer, etiqueta = 'Deshacer') {
    $('avisoTexto').textContent = texto;
    $('avisoBoton').textContent = deshacer ? etiqueta : '';
    accionDeshacer = deshacer;
    $('aviso').classList.add('ver');
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { $('aviso').classList.remove('ver'); accionDeshacer = null; }, 4000);
  }
  $('avisoBoton').onclick = () => {
    $('aviso').classList.remove('ver');
    if (accionDeshacer) accionDeshacer();
    accionDeshacer = null;
  };

  /* ---------- Arranque ---------- */

  if (esNativo) {
    // Botón "atrás" de Android: de Guardadas regresa a la hoja; desde la hoja sale de la app
    const App = registerPlugin('App');
    App.addListener('backButton', () => {
      if (!$('menuPdf').hidden) cerrarMenuPdf();
      else if (!$('visor').hidden) cerrarVisor();
      else if (seleccionando) { salirDeSeleccion(); pintarGuardadas(); }
      else if ($('vistaGuardadas').classList.contains('activa')) { salirDeSeleccion(); mostrar('vistaHoja'); }
      else App.exitApp();
    });
  }

  (async () => {
    try {
      await abrirBase();
      const id = await leerAjuste('hoja_actual');
      hoja = (id && await cargarHoja(Number(id))) || await crearHoja();
      $('cargando').remove();
      pintarEntrada();
      mostrar('vistaHoja');
    } catch (e) {
      $('cargando').textContent = 'No se pudo abrir la base de datos: ' + (e.message || e);
    }
  })();
</script>
</body>
