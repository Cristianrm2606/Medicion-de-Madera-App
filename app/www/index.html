<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a4a1e">
<title>Hoja de Madera</title>
<style>
  :root {
    --bg: #f4efe8;
    --surface: #ffffff;
    --surface-2: #ece4d9;
    --text: #231a12;
    --muted: #806f5f;
    --line: #e2d7c9;
    --accent: #7a4a1e;
    --accent-2: #a8692e;
    --on-accent: #ffffff;
    --key: #ffffff;
    --key-press: #e6dccf;
    --danger: #b3261e;
    --flash: #fff1d6;
    --dinero: #2e6b34;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120d;
      --surface: #221b14;
      --surface-2: #2e251c;
      --text: #f3ebe1;
      --muted: #a8988a;
      --line: #3a3026;
      --accent: #c98a4b;
      --accent-2: #e0a568;
      --on-accent: #1a120a;
      --key: #2b231b;
      --key-press: #3a3026;
      --danger: #ff8a80;
      --flash: #3d2e1c;
      --dinero: #8fd394;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  input { user-select: text; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
  }
  .vista { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .vista.activa { display: flex; }
  .cargando { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }

  /* Barra de arriba */
  .barra {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top))) 16px 12px;
    background: var(--accent); color: var(--on-accent);
  }
  .barra h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .barra button {
    color: var(--on-accent); padding: 8px 12px; border-radius: 999px;
    background: rgba(255,255,255,.16); font-size: 15px; font-weight: 600;
  }

  /* Resumen */
  .resumen {
    padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .proveedor {
    width: 100%; font-size: 17px; font-weight: 600; color: var(--text);
    border: 0; border-bottom: 1px dashed var(--line); background: transparent;
    padding: 4px 0; outline: none;
  }
  .proveedor:focus { border-bottom-color: var(--accent); }
  .proveedor::placeholder { color: var(--muted); font-weight: 400; }
  .estado { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 15px; }
  .cifras { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px; }
  .cifra small { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .cifra b { font-size: 30px; font-variant-numeric: tabular-nums; color: var(--dinero); }
  .cifra.der { text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; }
  .cifra.der b { font-size: 18px; color: var(--text); }
  .precios {
    margin-top: 8px; width: 100%; text-align: left; font-size: 13px; color: var(--muted);
    padding: 6px 10px; border-radius: 8px; background: var(--bg);
  }
  .precios b { color: var(--text); }
  .acciones { display: flex; gap: 8px; margin-top: 10px; }
  .acciones button {
    flex: 1; padding: 12px; border-radius: 10px;
    background: var(--surface-2); font-weight: 600; font-size: 16px;
  }
  .acciones button:disabled { opacity: .45; cursor: default; }
  .acciones .pdf { flex: 0 0 auto; padding: 12px 16px; }

  /* Lista de piezas */
  .lista { flex: 1; overflow-y: auto; min-height: 0; }
  .pieza {
    display: grid; grid-template-columns: 26px 1fr auto auto 36px; gap: 10px; align-items: center;
    padding: 0 6px 0 14px; height: 50px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .pieza.nueva { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .pieza .n { color: var(--muted); font-size: 13px; }
  .pieza .m { font-size: 18px; }
  .pieza .r { font-size: 18px; font-weight: 700; text-align: right; }
  .pieza .imp { font-size: 14px; color: var(--dinero); text-align: right; min-width: 72px; }
  .pieza .imp small { display: block; color: var(--muted); font-size: 11px; }
  .pieza button { color: var(--muted); font-size: 18px; height: 40px; border-radius: 8px; }
  .pieza button:active { background: var(--surface-2); color: var(--danger); }
  .vacio { color: var(--muted); text-align: center; padding: 32px 24px; line-height: 1.5; }

  /* Panel de captura */
  .captura {
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .campos { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .campo {
    text-align: left; padding: 6px 12px; border-radius: 10px;
    border: 2px solid var(--line); background: var(--bg);
  }
  .campo.activo { border-color: var(--accent); background: var(--surface); }
  .campo small { display: block; font-size: 12px; color: var(--muted); }
  .campo span { display: block; font-size: 26px; font-weight: 700; min-height: 32px; font-variant-numeric: tabular-nums; }
  .campo span:empty::after { content: "–"; color: var(--line); }
  .por { font-size: 22px; color: var(--muted); }
  .formula { text-align: center; color: var(--muted); font-size: 14px; height: 24px; line-height: 24px; }
  .formula b { color: var(--text); font-size: 16px; }

  .rapidos { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .rapidos button {
    flex: 1; padding: 6px 0; border-radius: 999px; border: 1px solid var(--line);
    font-size: 15px; font-weight: 600; color: var(--text);
  }
  .rapidos button.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .teclado button {
    height: 50px; border-radius: 10px; background: var(--key); border: 1px solid var(--line);
    font-size: 22px; font-weight: 600;
  }
  .teclado button:active { background: var(--key-press); }
  .teclado button:disabled { opacity: .3; cursor: default; }
  .teclado .cero { grid-column: span 2; }
  .teclado .agregar {
    grid-column: 4; grid-row: 2 / span 3; height: auto;
    background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 17px;
  }
  .teclado .agregar:active { background: var(--accent-2); }

  /* Hojas guardadas */
  .hoja-guardada {
    display: flex; align-items: center; gap: 6px; padding: 10px 6px 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .hoja-guardada .info { flex: 1; text-align: left; min-width: 0; }
  .hoja-guardada .info b { display: block; font-size: 17px; }
  .hoja-guardada .info small { color: var(--muted); font-size: 13px; }
  .hoja-guardada .info .din { display: block; color: var(--dinero); font-weight: 700; font-size: 16px; margin-top: 2px; }
  .hoja-guardada .pdf {
    padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 14px; font-weight: 600;
  }
  .hoja-guardada .quitar { color: var(--muted); width: 36px; height: 40px; border-radius: 8px; font-size: 18px; }

  /* Aviso con deshacer */
  .aviso {
    position: fixed; left: 50%; bottom: calc(24px + var(--safe-area-inset-bottom, 0px)); transform: translate(-50%, 200px);
    background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 10px;
    display: flex; gap: 16px; align-items: center; font-size: 15px;
    transition: transform .2s; max-width: calc(100% - 32px); z-index: 10;
  }
  .aviso.ver { transform: translate(-50%, 0); }
  .aviso button { color: var(--accent-2); font-weight: 700; }
  .aviso button:empty { display: none; }
  @media (prefers-color-scheme: dark) { .aviso button { color: var(--accent); } }
  .aviso span { white-space: nowrap; }

  /* Menú del PDF */
  .fondo {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .fondo[hidden] { display: none; }
  .menu {
    width: 100%; max-width: 480px; background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 16px 12px calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
    display: grid; gap: 8px;
  }
  .menu h2 { margin: 0 4px 4px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
    border-radius: 12px; background: var(--bg); font-size: 17px; font-weight: 600; text-align: left;
  }
  .menu button:active { background: var(--surface-2); }
  .menu .whatsapp { background: #25d366; color: #ffffff; }
  .menu .whatsapp:active { background: #1ebe5b; }
  .menu .cancelar { background: transparent; justify-content: center; color: var(--muted); }
  .menu .ico { font-size: 22px; width: 26px; text-align: center; }
</style>
</head>
<body>
<div class="app">

  <div class="cargando" id="cargando">Abriendo…</div>

  <!-- Vista: hoja actual -->
  <section class="vista" id="vistaHoja">
    <header class="barra">
      <h1>🪵 Hoja de Madera</h1>
      <button id="irGuardadas">Guardadas</button>
    </header>

    <div class="resumen">
      <input class="proveedor" id="proveedor" placeholder="Proveedor (toca para escribir)" autocomplete="off">
      <div class="estado" id="estado"></div>
      <div class="cifras">
        <div class="cifra"><small>A pagar</small><b id="pagar">$0</b></div>
        <div class="cifra der">Total <b id="total">0</b><br><span id="piezas">0</span> piezas</div>
      </div>
      <button class="precios" id="precios"></button>
      <div class="acciones">
        <button class="pdf" id="pdfActual" hidden>📄 PDF</button>
        <button id="guardar">Guardar hoja y empezar otra</button>
      </div>
    </div>

    <div class="lista" id="lista"></div>

    <div class="captura">
      <div class="campos">
        <button class="campo activo" id="campoA"><small>Medida</small><span id="valA"></span></button>
        <div class="por">×</div>
        <button class="campo" id="campoB"><small>Largo</small><span id="valB"></span></button>
      </div>
      <div class="formula" id="formula"></div>
      <div class="rapidos">
        <span>Largo:</span>
        <button data-largo="3">3</button>
        <button data-largo="4">4</button>
        <button data-largo="5">5</button>
        <button data-largo="6">6</button>
      </div>
      <div class="teclado" id="teclado">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="borrar" aria-label="Borrar">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="agregar" class="agregar">Agregar</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k=".">.</button><button data-k="0" class="cero">0</button>
      </div>
    </div>
  </section>

  <!-- Vista: hojas guardadas -->
  <section class="vista" id="vistaGuardadas">
    <header class="barra">
      <h1>Hojas guardadas</h1>
      <button id="volver">← Volver</button>
    </header>
    <div class="lista" id="listaGuardadas"></div>
  </section>

</div>

<div class="aviso" id="aviso"><span id="avisoTexto"></span><button id="avisoBoton"></button></div>

<div class="fondo" id="menuPdf" hidden>
  <div class="menu">
    <h2 id="menuPdfTitulo">PDF de la hoja</h2>
    <button class="whatsapp" data-pdf="whatsapp"><span class="ico">💬</span>Mandar por WhatsApp</button>
    <button data-pdf="descargar"><span class="ico">⬇️</span>Descargar al teléfono</button>
    <button data-pdf="otros"><span class="ico">📤</span>Otras opciones (correo, Drive, imprimir…)</button>
    <button class="cancelar" data-pdf="cancelar">Cancelar</button>
  </div>
</div>

<script src="capacitor.js"></script>
<script src="jspdf.umd.min.js"></script>
<script>
  const { Capacitor, registerPlugin } = capacitorExports;
  const esNativo = Capacitor.isNativePlatform();

  // Fórmula de la hoja: medida × medida × largo ÷ 4
  const calcular = (a, b) => a * a * b / 4;
  const fmt = n => Number(n.toFixed(2)).toLocaleString('es', { useGrouping: 'always' });
  const moneda = (n, simbolo) =>
    simbolo + n.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
  const dinero = n => moneda(n, '₡');
  const $ = id => document.getElementById(id);

  // Precio por unidad: de 8 para abajo vale uno, de 9 para arriba vale otro
  let precios = { bajo: 80, alto: 100 };
  const precioPara = medida => medida <= 8 ? precios.bajo : precios.alto;

  /* ---------- Base de datos SQLite ---------- */

  const BD = 'madera';
  let consulta, ejecutar;

  function cargarScript(src) {
    return new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = mal;
      document.head.appendChild(s);
    });
  }

  async function abrirBase() {
    if (esNativo) {
      // En el teléfono: SQLite de Android, guardado en el aparato
      const S = registerPlugin('CapacitorSQLite');
      try {
        await S.createConnection({ database: BD, version: 1, encrypted: false, mode: 'no-encryption', readonly: false });
      } catch (e) { /* la conexión ya existía */ }
      await S.open({ database: BD, readonly: false });
      consulta = async (sql, v = []) =>
        (await S.query({ database: BD, statement: sql, values: v, readonly: false })).values || [];
      ejecutar = async (sql, v = []) =>
        (await S.run({ database: BD, statement: sql, values: v, transaction: true, readonly: false })).changes.lastId;
    } else {
      // En la computadora (solo para probar): SQLite en memoria con sql.js
      const cdn = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
      await cargarScript(cdn + 'sql-wasm.js');
      const SQL = await initSqlJs({ locateFile: f => cdn + f });
      const base = new SQL.Database();
      consulta = async (sql, v = []) => {
        const st = base.prepare(sql);
        st.bind(v);
        const filas = [];
        while (st.step()) filas.push(st.getAsObject());
        st.free();
        return filas;
      };
      ejecutar = async (sql, v = []) => {
        base.run(sql, v);
        return base.exec('SELECT last_insert_rowid()')[0].values[0][0];
      };
    }

    await ejecutar(`CREATE TABLE IF NOT EXISTS hojas (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      proveedor TEXT NOT NULL DEFAULT '',
      fecha TEXT,
      guardada INTEGER NOT NULL DEFAULT 0
    )`);
    await ejecutar(`CREATE TABLE IF NOT EXISTS piezas (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      hoja_id INTEGER NOT NULL,
      medida REAL NOT NULL,
      largo REAL NOT NULL
    )`);
    await ejecutar('CREATE TABLE IF NOT EXISTS ajustes (clave TEXT PRIMARY KEY, valor TEXT)');

    // Versión 2: cada pieza guarda su precio, para que las hojas viejas no cambien si sube el precio
    const columnas = await consulta('PRAGMA table_info(piezas)');
    if (!columnas.some(c => c.name === 'precio')) {
      await ejecutar('ALTER TABLE piezas ADD COLUMN precio REAL');
      await ejecutar('UPDATE piezas SET precio = CASE WHEN medida <= 8 THEN 80 ELSE 100 END');
    }

    const bajo = await leerAjuste('precio_bajo'), alto = await leerAjuste('precio_alto');
    if (bajo !== null) precios.bajo = Number(bajo);
    if (alto !== null) precios.alto = Number(alto);
  }

  async function leerAjuste(clave) {
    const f = await consulta('SELECT valor FROM ajustes WHERE clave = ?', [clave]);
    return f.length ? f[0].valor : null;
  }
  const fijarAjuste = (clave, valor) =>
    ejecutar('INSERT OR REPLACE INTO ajustes (clave, valor) VALUES (?, ?)', [clave, String(valor)]);

  async function cargarHoja(id) {
    const h = (await consulta('SELECT id, proveedor, fecha, guardada FROM hojas WHERE id = ?', [id]))[0];
    if (!h) return null;
    const filas = await consulta(
      'SELECT id, medida AS a, largo AS b, precio AS p FROM piezas WHERE hoja_id = ? ORDER BY id', [id]);
    return { id: h.id, proveedor: h.proveedor, fecha: h.fecha, guardada: !!h.guardada, filas };
  }

  async function crearHoja() {
    const id = await ejecutar("INSERT INTO hojas (proveedor) VALUES ('')");
    await fijarAjuste('hoja_actual', id);
    return { id, proveedor: '', fecha: null, guardada: false, filas: [] };
  }

  async function borrarHojaDeBase(id) {
    await ejecutar('DELETE FROM piezas WHERE hoja_id = ?', [id]);
    await ejecutar('DELETE FROM hojas WHERE id = ?', [id]);
  }

  async function restaurarHoja(h) {
    await ejecutar('INSERT INTO hojas (id, proveedor, fecha, guardada) VALUES (?, ?, ?, ?)',
      [h.id, h.proveedor, h.fecha, h.guardada ? 1 : 0]);
    for (const f of h.filas)
      await ejecutar('INSERT INTO piezas (id, hoja_id, medida, largo, precio) VALUES (?, ?, ?, ?, ?)',
        [f.id, h.id, f.a, f.b, f.p]);
  }

  /* ---------- Hoja actual ---------- */

  let hoja;
  let entrada = { a: '', b: '4' };
  let campo = 'a';

  const importe = f => calcular(f.a, f.b) * f.p;
  const totalDe = h => h.filas.reduce((s, f) => s + calcular(f.a, f.b), 0);
  const pagarDe = h => h.filas.reduce((s, f) => s + importe(f), 0);

  function pintarHoja(resaltarUltima) {
    $('proveedor').value = hoja.proveedor;
    $('estado').textContent = hoja.guardada ? 'Hoja guardada · los cambios se guardan solos' : '';
    $('total').textContent = fmt(totalDe(hoja));
    $('pagar').textContent = dinero(pagarDe(hoja));
    $('piezas').textContent = hoja.filas.length;
    $('precios').innerHTML = 'Precio: hasta 8 → <b>' + dinero(precios.bajo) + '</b> · de 9 para arriba → <b>' +
      dinero(precios.alto) + '</b> ✎';
    $('guardar').disabled = hoja.filas.length === 0;
    $('guardar').textContent = hoja.guardada ? 'Listo, empezar otra' : 'Guardar hoja y empezar otra';
    $('pdfActual').hidden = !hoja.guardada;

    const lista = $('lista');
    lista.innerHTML = '';
    if (hoja.filas.length === 0) {
      lista.innerHTML = '<div class="vacio">Escribe la medida y el largo con el teclado de abajo y toca <b>Agregar</b>.</div>';
      return;
    }
    hoja.filas.forEach((f, i) => {
      const fila = document.createElement('div');
      fila.className = 'pieza' + (resaltarUltima && i === hoja.filas.length - 1 ? ' nueva' : '');
      fila.innerHTML =
        '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="m">' + fmt(f.a) + ' × ' + fmt(f.b) + '</span>' +
        '<span class="r">' + fmt(calcular(f.a, f.b)) + '</span>' +
        '<span class="imp">' + dinero(importe(f)) + '<small>a ' + dinero(f.p) + '</small></span>' +
        '<button aria-label="Quitar pieza">✕</button>';
      fila.querySelector('button').onclick = () => quitarPieza(i);
      lista.appendChild(fila);
    });
    if (resaltarUltima) lista.scrollTop = lista.scrollHeight;
  }

  async function quitarPieza(i) {
    const [quitada] = hoja.filas.splice(i, 1);
    pintarHoja();
    await ejecutar('DELETE FROM piezas WHERE id = ?', [quitada.id]);
    const h = hoja;
    avisar('Pieza ' + fmt(quitada.a) + ' × ' + fmt(quitada.b) + ' quitada', async () => {
      await ejecutar('INSERT INTO piezas (id, hoja_id, medida, largo, precio) VALUES (?, ?, ?, ?, ?)',
        [quitada.id, h.id, quitada.a, quitada.b, quitada.p]);
      h.filas.splice(i, 0, quitada);
      if (h === hoja) pintarHoja();
    });
  }

  $('precios').onclick = async () => {
    const bajo = pedirPrecio('Precio de las de 8 para abajo:', precios.bajo);
    if (bajo === null) return;
    const alto = pedirPrecio('Precio de las de 9 para arriba:', precios.alto);
    if (alto === null) return;
    precios = { bajo, alto };
    await fijarAjuste('precio_bajo', bajo);
    await fijarAjuste('precio_alto', alto);
    // La hoja que se está llenando toma el precio nuevo; las guardadas se quedan como estaban
    if (!hoja.guardada) {
      for (const f of hoja.filas) f.p = precioPara(f.a);
      await ejecutar('UPDATE piezas SET precio = CASE WHEN medida <= 8 THEN ? ELSE ? END WHERE hoja_id = ?',
        [bajo, alto, hoja.id]);
    }
    pintarHoja();
  };

  function pedirPrecio(texto, actual) {
    const r = prompt(texto, actual);
    if (r === null) return null;
    const n = parseFloat(r.replace(',', '.'));
    if (!(n >= 0)) { alert('Ese precio no es válido.'); return null; }
    return n;
  }

  /* ---------- Captura ---------- */

  function pintarEntrada() {
    $('valA').textContent = entrada.a;
    $('valB').textContent = entrada.b;
    $('campoA').classList.toggle('activo', campo === 'a');
    $('campoB').classList.toggle('activo', campo === 'b');
    document.querySelectorAll('[data-largo]').forEach(b =>
      b.classList.toggle('sel', b.dataset.largo === entrada.b));
    document.querySelector('[data-k="."]').disabled = campo === 'a';
    const a = parseFloat(entrada.a), b = parseFloat(entrada.b);
    $('formula').innerHTML = (a > 0 && b > 0)
      ? fmt(a) + ' × ' + fmt(a) + ' × ' + fmt(b) + ' ÷ 4 = <b>' + fmt(calcular(a, b)) + '</b> · ' +
        dinero(calcular(a, b) * precioPara(a))
      : '';
  }

  function tecla(k) {
    if (k === 'agregar') return agregar();
    let v = entrada[campo];
    if (k === 'borrar') v = v.slice(0, -1);
    // La medida de la tuca siempre es entera; solo el largo acepta decimales
    else if (k === '.') { if (campo === 'a') return; if (!v.includes('.')) v = (v || '0') + '.'; }
    else if (v.length < 6) v = (v === '0' ? '' : v) + k;
    entrada[campo] = v;
    pintarEntrada();
  }

  async function agregar() {
    const a = parseFloat(entrada.a), b = parseFloat(entrada.b);
    if (!(a > 0)) { campo = 'a'; pintarEntrada(); return; }
    if (!(b > 0)) { campo = 'b'; pintarEntrada(); return; }
    const p = precioPara(a);
    // El largo casi siempre se repite, así que se queda puesto
    entrada.a = '';
    campo = 'a';
    pintarEntrada();
    const id = await ejecutar('INSERT INTO piezas (hoja_id, medida, largo, precio) VALUES (?, ?, ?, ?)',
      [hoja.id, a, b, p]);
    hoja.filas.push({ id, a, b, p });
    pintarHoja(true);
  }

  $('teclado').onclick = e => { const b = e.target.closest('button'); if (b) tecla(b.dataset.k); };
  $('campoA').onclick = () => { campo = 'a'; pintarEntrada(); };
  $('campoB').onclick = () => { campo = 'b'; pintarEntrada(); };
  document.querySelectorAll('[data-largo]').forEach(b => b.onclick = () => {
    entrada.b = b.dataset.largo;
    campo = 'a';
    pintarEntrada();
  });

  // Teclado físico (en computadora)
  document.addEventListener('keydown', e => {
    if (document.activeElement === $('proveedor')) {
      if (e.key === 'Enter') $('proveedor').blur();
      return;
    }
    if (!$('vistaHoja').classList.contains('activa')) return;
    if (/^[0-9]$/.test(e.key)) tecla(e.key);
    else if (e.key === '.' || e.key === ',') tecla('.');
    else if (e.key === 'Backspace') tecla('borrar');
    else if (e.key === 'Enter') { e.preventDefault(); tecla('agregar'); }
    else if (e.key === 'x' || e.key === '*' || e.key === 'Tab') {
      e.preventDefault(); campo = campo === 'a' ? 'b' : 'a'; pintarEntrada();
    }
  });

  $('proveedor').oninput = e => {
    hoja.proveedor = e.target.value;
    ejecutar('UPDATE hojas SET proveedor = ? WHERE id = ?', [hoja.proveedor, hoja.id]);
  };

  /* ---------- Guardar y hojas guardadas ---------- */

  $('guardar').onclick = async () => {
    if (hoja.filas.length === 0) return;
    const anterior = hoja;
    const yaEstabaGuardada = anterior.guardada;
    if (!yaEstabaGuardada) {
      anterior.fecha = new Date().toISOString();
      anterior.guardada = true;
      await ejecutar('UPDATE hojas SET guardada = 1, fecha = ? WHERE id = ?', [anterior.fecha, anterior.id]);
    }
    hoja = await crearHoja();
    pintarHoja();
    const nueva = hoja;
    avisar(yaEstabaGuardada ? 'Listo' : 'Hoja guardada', async () => {
      await borrarHojaDeBase(nueva.id);
      if (!yaEstabaGuardada) {
        anterior.guardada = false;
        anterior.fecha = null;
        await ejecutar('UPDATE hojas SET guardada = 0, fecha = NULL WHERE id = ?', [anterior.id]);
      }
      await fijarAjuste('hoja_actual', anterior.id);
      hoja = anterior;
      pintarHoja();
    });
  };

  $('pdfActual').onclick = () => crearPDF(hoja);

  function fechaCorta(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('es', { day: 'numeric', month: 'short' }) +
      ' · ' + d.toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit' });
  }

  async function pintarGuardadas() {
    const guardadas = await consulta(`
      SELECT h.id, h.proveedor, h.fecha,
             COUNT(p.id) AS piezas,
             COALESCE(SUM(p.medida * p.medida * p.largo / 4 * p.precio), 0) AS pagar
      FROM hojas h LEFT JOIN piezas p ON p.hoja_id = h.id
      WHERE h.guardada = 1
      GROUP BY h.id
      ORDER BY h.fecha DESC`);
    const lista = $('listaGuardadas');
    lista.innerHTML = '';
    if (guardadas.length === 0) {
      lista.innerHTML = '<div class="vacio">Aún no hay hojas guardadas.</div>';
      return;
    }
    guardadas.forEach(h => {
      const fila = document.createElement('div');
      fila.className = 'hoja-guardada';
      fila.innerHTML =
        '<button class="info"><b></b><small></small><span class="din"></span></button>' +
        '<button class="pdf">📄 PDF</button>' +
        '<button class="quitar" aria-label="Borrar hoja">✕</button>';
      fila.querySelector('b').textContent = h.proveedor || 'Sin proveedor';
      fila.querySelector('small').textContent = fechaCorta(h.fecha) + ' · ' + h.piezas + ' piezas';
      fila.querySelector('.din').textContent = dinero(h.pagar);
      fila.querySelector('.info').onclick = () => abrirGuardada(h.id);
      fila.querySelector('.pdf').onclick = async () => crearPDF(await cargarHoja(h.id));
      fila.querySelector('.quitar').onclick = () => borrarGuardada(h.id);
      lista.appendChild(fila);
    });
  }

  async function borrarGuardada(id) {
    const completa = await cargarHoja(id);
    await borrarHojaDeBase(id);
    if (hoja.id === id) hoja = await crearHoja();
    await pintarGuardadas();
    avisar('Hoja borrada', async () => {
      await restaurarHoja(completa);
      await pintarGuardadas();
    });
  }

  async function abrirGuardada(id) {
    if (hoja.id !== id && !hoja.guardada) {
      if (hoja.filas.length &&
          !confirm('La hoja que estás llenando no está guardada y se va a perder. ¿Abrir esta de todos modos?')) return;
      await borrarHojaDeBase(hoja.id);
    }
    await fijarAjuste('hoja_actual', id);
    hoja = await cargarHoja(id);
    mostrar('vistaHoja');
  }

  function mostrar(id) {
    document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === id));
    if (id === 'vistaHoja') pintarHoja(); else pintarGuardadas();
  }
  $('irGuardadas').onclick = () => mostrar('vistaGuardadas');
  $('volver').onclick = () => mostrar('vistaHoja');

  /* ---------- PDF ---------- */

  // Las letras que trae el PDF no tienen el símbolo ₡, así que se mete DejaVu Sans (letra libre)
  let fuentes = null;
  async function cargarFuentes() {
    if (fuentes) return fuentes;
    const base64 = async archivo => {
      const bytes = new Uint8Array(await (await fetch('fuentes/' + archivo)).arrayBuffer());
      let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    };
    fuentes = { normal: await base64('DejaVuSans.ttf'), bold: await base64('DejaVuSans-Bold.ttf') };
    return fuentes;
  }

  function dibujarPDF(h, fuentes) {
    const doc = new jspdf.jsPDF({ unit: 'mm', format: 'letter' });
    doc.addFileToVFS('DejaVuSans.ttf', fuentes.normal);
    doc.addFont('DejaVuSans.ttf', 'DejaVu', 'normal');
    doc.addFileToVFS('DejaVuSans-Bold.ttf', fuentes.bold);
    doc.addFont('DejaVuSans-Bold.ttf', 'DejaVu', 'bold');
    const izq = 15, der = 200, alto = 279;
    const fecha = new Date(h.fecha || Date.now());
    const cols = [
      { t: 'No.', x: izq, w: 14, al: 'center' },
      { t: 'MEDIDA', x: izq + 14, w: 50, al: 'center' },
      { t: 'RESULTADO', x: izq + 64, w: 42, al: 'right' },
      { t: 'PRECIO', x: izq + 106, w: 32, al: 'right' },
      { t: 'IMPORTE', x: izq + 138, w: 47, al: 'right' },
    ];
    const fila = 8;
    let y;

    function texto(t, c, yy) {
      const x = c.al === 'center' ? c.x + c.w / 2 : c.al === 'right' ? c.x + c.w - 2 : c.x + 2;
      doc.text(String(t), x, yy, { align: c.al });
    }

    function encabezado(pagina) {
      doc.setFont('DejaVu', 'bold'); doc.setFontSize(20);
      doc.text('HOJA DE MADERA', izq, 22);
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(10);
      doc.text('Fecha: ' + fecha.toLocaleDateString('es', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        '   Hoja No. ' + h.id + (pagina > 1 ? '   (pág. ' + pagina + ')' : ''), der, 22, { align: 'right' });

      doc.setLineWidth(0.4);
      doc.rect(izq, 28, der - izq, 10);
      doc.setFont('DejaVu', 'bold'); doc.setFontSize(10);
      doc.text('PROVEEDOR:', izq + 3, 34.5);
      const xNombre = izq + 3 + doc.getTextWidth('PROVEEDOR:') + 3;
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(12);
      doc.text(h.proveedor || '', xNombre, 34.5);

      y = 44;
      doc.setFillColor(235, 228, 218);
      doc.rect(izq, y, der - izq, fila, 'FD');
      doc.setFont('DejaVu', 'bold'); doc.setFontSize(9);
      cols.forEach(c => texto(c.t, c, y + 5.5));
      cols.slice(1).forEach(c => doc.line(c.x, y, c.x, y + fila));
      y += fila;
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(11);
    }

    let pagina = 1;
    encabezado(pagina);
    h.filas.forEach((f, i) => {
      if (y + fila > alto - 40) { doc.addPage(); encabezado(++pagina); }
      doc.setLineWidth(0.2);
      doc.rect(izq, y, der - izq, fila);
      cols.slice(1).forEach(c => doc.line(c.x, y, c.x, y + fila));
      const v = [String(i + 1).padStart(2, '0'), fmt(f.a) + ' x ' + fmt(f.b),
                 fmt(calcular(f.a, f.b)), dinero(f.p), dinero(importe(f))];
      cols.forEach((c, j) => texto(v[j], c, y + 5.5));
      y += fila;
    });

    // Totales
    if (y + 36 > alto) { doc.addPage(); encabezado(++pagina); }
    y += 6;
    const cajaY = y;
    const grupos = {};
    h.filas.forEach(f => {
      const g = grupos[f.p] || (grupos[f.p] = { piezas: 0, total: 0 });
      g.piezas++; g.total += calcular(f.a, f.b);
    });
    doc.setFontSize(10);
    Object.keys(grupos).map(Number).sort((a, b) => a - b).forEach(p => {
      const g = grupos[p];
      doc.text(g.piezas + ' piezas a ' + dinero(p) + ':  ' + fmt(g.total) + ' x ' + dinero(p) + ' = ' +
        dinero(g.total * p), izq, y);
      y += 6;
    });

    const cajaX = izq + 106;
    doc.setLineWidth(0.4);
    doc.rect(cajaX, cajaY - 5, der - cajaX, 22);
    doc.setFontSize(10);
    doc.text('Piezas: ' + h.filas.length, cajaX + 3, cajaY + 1);
    doc.text('Total: ' + fmt(totalDe(h)), der - 3, cajaY + 1, { align: 'right' });
    doc.setFont('DejaVu', 'bold'); doc.setFontSize(10);
    doc.text('A PAGAR:', cajaX + 3, cajaY + 12);
    doc.setFontSize(15);
    doc.text(dinero(pagarDe(h)), der - 3, cajaY + 12.5, { align: 'right' });

    // Firmas
    const yf = Math.max(y + 30, cajaY + 45);
    if (yf < alto - 5) {
      doc.setFont('DejaVu', 'normal'); doc.setFontSize(9); doc.setLineWidth(0.2);
      doc.line(izq + 5, yf, izq + 75, yf);
      doc.line(der - 75, yf, der - 5, yf);
      doc.text('Recibió', izq + 40, yf + 5, { align: 'center' });
      doc.text('Entregó (proveedor)', der - 40, yf + 5, { align: 'center' });
    }
    return doc;
  }

  // El botón PDF abre un menú: WhatsApp, Descargar u otras opciones
  let hojaDelMenu = null;
  function crearPDF(h) {
    if (!h || h.filas.length === 0) return;
    hojaDelMenu = h;
    $('menuPdfTitulo').textContent = 'PDF de la hoja · ' + (h.proveedor || 'Sin proveedor');
    $('menuPdf').hidden = false;
  }
  const cerrarMenuPdf = () => { $('menuPdf').hidden = true; };
  $('menuPdf').onclick = e => {
    const b = e.target.closest('[data-pdf]');
    if (e.target === $('menuPdf') || b) cerrarMenuPdf();
    if (b && b.dataset.pdf !== 'cancelar') hacerPDF(hojaDelMenu, b.dataset.pdf);
  };

  async function hacerPDF(h, como) {
    const doc = dibujarPDF(h, await cargarFuentes());
    const nombre = ('Hoja ' + h.id + ' ' + (h.proveedor || 'sin proveedor'))
      .replace(/[^\wáéíóúñÁÉÍÓÚÑ ]+/g, '').trim().replace(/\s+/g, '_') + '.pdf';
    if (!esNativo) { doc.save(nombre); return; }
    try {
      const Filesystem = registerPlugin('Filesystem');
      const Pdf = registerPlugin('Pdf');
      await Filesystem.writeFile({ path: nombre, data: doc.output('datauristring').split(',')[1], directory: 'CACHE' });
      const { uri } = await Filesystem.getUri({ path: nombre, directory: 'CACHE' });

      if (como === 'whatsapp') {
        try { await Pdf.whatsapp({ ruta: uri }); return; }
        catch (e) {
          if (e.code !== 'SIN_WHATSAPP') throw e;
          alert('WhatsApp no está instalado en este teléfono. Se abrirán las otras opciones.');
          como = 'otros';
        }
      }
      if (como === 'descargar') {
        try {
          const r = await Pdf.descargar({ ruta: uri, nombre });
          avisar('Guardado en Descargas', () => Pdf.abrir({ uri: r.uri })
            .catch(() => alert('No hay una app para abrir PDF en este teléfono.')), 'Abrir');
          return;
        } catch (e) {
          if (e.code !== 'ANDROID_VIEJO') throw e;
          como = 'otros';
        }
      }
      // Menú de compartir de Android: correo, Drive, imprimir, guardar en archivos…
      await registerPlugin('Share').share({ title: nombre, url: uri, dialogTitle: 'Compartir hoja en PDF' });
    } catch (e) {
      if (!/cancel/i.test(e.message || '')) alert('No se pudo crear el PDF: ' + (e.message || e));
    }
  }

  /* ---------- Aviso con deshacer ---------- */

  let temporizador, accionDeshacer;
  function avisar(texto, deshacer, etiqueta = 'Deshacer') {
    $('avisoTexto').textContent = texto;
    $('avisoBoton').textContent = deshacer ? etiqueta : '';
    accionDeshacer = deshacer;
    $('aviso').classList.add('ver');
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { $('aviso').classList.remove('ver'); accionDeshacer = null; }, 4000);
  }
  $('avisoBoton').onclick = () => {
    $('aviso').classList.remove('ver');
    if (accionDeshacer) accionDeshacer();
    accionDeshacer = null;
  };

  /* ---------- Arranque ---------- */

  if (esNativo) {
    // Botón "atrás" de Android: de Guardadas regresa a la hoja; desde la hoja sale de la app
    const App = registerPlugin('App');
    App.addListener('backButton', () => {
      if (!$('menuPdf').hidden) cerrarMenuPdf();
      else if ($('vistaGuardadas').classList.contains('activa')) mostrar('vistaHoja');
      else App.exitApp();
    });
  }

  (async () => {
    try {
      await abrirBase();
      const id = await leerAjuste('hoja_actual');
      hoja = (id && await cargarHoja(Number(id))) || await crearHoja();
      $('cargando').remove();
      pintarEntrada();
      mostrar('vistaHoja');
    } catch (e) {
      $('cargando').textContent = 'No se pudo abrir la base de datos: ' + (e.message || e);
    }
  })();
</script>
</body>
